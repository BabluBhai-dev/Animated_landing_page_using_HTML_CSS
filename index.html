<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Landing Page website Design Using HTML & CSS</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <img src="images/logow.png" width="200" />
        </div>
        <div class="menu">
          <a href="#">Home</a>
          <a href="#">Features</a>
          <a href="#">Booking</a>
          <a href="#">Login</a>
        </div>
      </nav>
    </header>
    <div class="line">
      <div class="box1"></div>
      <div class="box2"></div>
      <div class="box3"></div>
    </div>
    <div class="container">
      <div class="left animate__animated animate__jackInTheBox">
        <h1>Future<br />On your Hand</h1>
        <button>Order</button>
      </div>
      <div class="right">
        <img
          src="images/wat3.png"
          class="animate__animated animate__lightSpeedInLeft"
        />
      </div>
    </div>
    <div class="s-icon">
      <img src="images/icon1.png" />
      <img src="images/icon2.png" />
      <img src="images/icon3.png" />
      <img src="images/icon4.png" />
    </div>
  </body>
</html>
